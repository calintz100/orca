# Orca Flow (personal fork build): packages the Windows installer with the Flow panel and
# attaches it to a GitHub release on this fork. Triggered by pushing an `orca-flow-v*` tag.
# ORCA_FLOW_BUILD=1 makes electron-builder produce a separate app ("Orca Flow", own install
# folder and userData) that never auto-updates from the official Orca feed.
name: Orca Flow Windows release

on:
  push:
    tags:
      - 'orca-flow-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (created if missing)
        required: true

permissions:
  contents: write

concurrency:
  group: orca-flow-win-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'stablyai/orca'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ORCA_FLOW_BUILD: '1'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      # pnpm must be on PATH before setup-node so setup-node can locate the store.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      # Retried: electron's postinstall downloads its binary and that CDN returns transient 504s.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app
        shell: bash
        run: pnpm build:release

      - name: Package installer
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          shell: pwsh
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Attach installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=dist/orca-flow-windows-setup.exe
          test -f "$installer"
          sha=$(sha256sum "$installer" | cut -d' ' -f1)
          notes=$(cat <<EOF
          Orca Flow — Orca에 흐름 기능(창 옆 흐름 패널, 오늘의 흐름)을 더한 개인 빌드입니다.

          - \`orca-flow-windows-setup.exe\`를 실행하면 공식 Orca와 따로 설치됩니다(앱 이름 Orca Flow, 데이터 %APPDATA%\\orca-flow). 자동 업데이트는 꺼져 있습니다.
          - 코드 서명이 없습니다. Windows가 "알 수 없는 게시자" 경고를 띄우면 **추가 정보 → 실행**을 누르세요. Smart App Control이 켜진 PC에서는 설치가 막힙니다.
          - 흐름 기록에는 Claude Code CLI(\`claude\` 명령)가 PATH에 있어야 합니다.

          SHA-256: \`$sha\`
          소스: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$installer" --clobber
          else
            gh release create "$RELEASE_TAG" "$installer" --target "$GITHUB_SHA" --title "Orca Flow ${RELEASE_TAG#orca-flow-v}" --notes "$notes"
          fi
